<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite de 15 Anos - Ana Júlia</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0c10;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }

        .scene {
            width: 360px;
            height: 560px;
            position: relative;
            cursor: pointer;
        }

        /* Envelope */
        .envelope-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: transform 0.8s ease, opacity 0.6s ease;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-top: 130px solid #2c3542;
            transform-origin: top;
            transition: transform 0.6s ease 0.2s;
            z-index: 12;
        }

        .seal {
            position: absolute;
            top: 105px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #f39c12 0%, #d4af37 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0b0c10;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 13;
            transition: transform 0.3s ease;
        }

        .envelope-text {
            position: absolute;
            bottom: 60px;
            color: #d4af37;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Card Interno */
        .invitation-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 25px;
            text-align: center;
            z-index: 1;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.8s ease 0.4s;
            border: 1px solid #e0e0e0;
        }

        .card-header h3 {
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
        }

        .card-header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            color: #ff69b4;
            margin-bottom: 0;
        }

        .card-body {
            margin: 15px 0;
            border-top: 1px solid #eaeaea;
            border-bottom: 1px solid #eaeaea;
            padding: 20px 0;
            text-align: left;
        }

        .info-row {
            display: flex;
            margin-bottom: 12px;
            font-size: 14px;
            color: #444;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #1e90ff;
            width: 110px;
            flex-shrink: 0;
        }

        .info-value {
            color: #555;
        }

        .card-footer p {
            font-size: 13px;
            color: #777;
            font-style: italic;
            line-height: 1.5;
        }

        /* Estado Aberto */
        .scene.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .scene.open .seal,
        .scene.open .envelope-text {
            opacity: 0;
            pointer-events: none;
        }

        .scene.open .envelope-wrapper {
            transform: translateY(100%) scale(0.8);
            opacity: 0;
            pointer-events: none;
        }

        .scene.open .invitation-card {
            opacity: 1;
            transform: scale(1);
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="scene" id="scene" onclick="openInvite()">
        <!-- Envelope -->
        <div class="envelope-wrapper">
            <div class="envelope-flap"></div>
            <div class="seal">AJ</div>
            <div class="envelope-text">Toque para Abrir</div>
        </div>

        <!-- Convite -->
        <div class="invitation-card">
            <div class="card-header">
                <h3>Meus 15 Anos</h3>
                <h1>Ana Júlia</h1>
            </div>

            <div class="card-body">
                <div class="info-row">
                    <span class="info-label">Data:</span>
                    <span class="info-value">16 de Outubro</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Horário:</span>
                    <span class="info-value">20:00</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Local:</span>
                    <span class="info-value">Rally Flores, Cascalho</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Cores:</span>
                    <span class="info-value">Azul, Rosa e Prata</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Confirmação:</span>
                    <span class="info-value">Até 20/09</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Contato:</span>
                    <span class="info-value">(19) 99999-1494</span>
                </div>
            </div>

            <div class="card-footer">
                <p>Sua presença tornará esta noite inesquecível. Conto com você!</p>
            </div>
        </div>
    </div>

    <script>
        function openInvite() {
            const scene = document.getElementById('scene');
            if (!scene.classList.contains('open')) {
                scene.classList.add('open');
            }
        }
    </script>

</body>
</html>
