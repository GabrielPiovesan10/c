<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite 15 Anos - Ana Júlia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .invitation-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border-top: 5px solid #ff69b4;
            border-bottom: 5px solid #1e90ff;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }
        h2 {
            color: #ff69b4;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .details {
            text-align: left;
            margin: 20px 0;
            font-size: 16px;
            color: #555;
            line-height: 1.8;
        }
        .details strong {
            color: #333;
        }
        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <h1>Festa de 15 Anos</h1>
        <h2>Ana Júlia</h2>
        
        <div class="details">
            <p><strong>Data:</strong> 16/10</p>
            <p><strong>Horário:</strong> 20:00</p>
            <p><strong>Local:</strong> Rally Flores, Cascalho</p>
            <p><strong>Cores:</strong> Azul, Rosa e Prata</p>
            <p><strong>Confirmação até:</strong> 20/09</p>
            <p><strong>Contato:</strong> (19) 99999-1494</p>
        </div>

        <div class="footer">
            <p>Esperamos você para celebrar este momento conosco!</p>
        </div>
    </div>

</body>
</html>
