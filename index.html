<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite 15 Anos - Ana Julia</title>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Variáveis de Cores */
        :root {
            --azul-escuro: #0a1128;
            --prata: #e0e0e0;
            --prata-brilho: #ffffff;
            --rosa: #f4acb7;
            --rosa-escuro: #d58996;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--prata);
            overflow-x: hidden;
        }

        /* Container Mobile */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(135deg, var(--azul-escuro) 0%, #1a2754 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Tela 1: Capa */
        .cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--azul-escuro) 0%, #121c3b 100%);
            z-index: 10;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1), opacity 1s ease;
            padding: 20px;
            text-align: center;
            border: 2px solid var(--prata);
        }

        .cover.open {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .title-cursive {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: var(--rosa);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--prata);
            margin-bottom: 50px;
        }

        /* Botão Interativo */
        .btn {
            background: transparent;
            border: 2px solid var(--rosa);
            color: var(--rosa);
            padding: 15px 30px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            width: 80%;
        }

        .btn:hover, .btn-open:hover {
            background: var(--rosa);
            color: var(--azul-escuro);
            box-shadow: 0 0 15px var(--rosa);
        }

        .btn-open {
            background: var(--prata);
            color: var(--azul-escuro);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Tela 2: Conteúdo do Convite */
        .content {
            padding: 30px 20px;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            overflow-y: auto;
        }

        /* Estilo da Foto da Debutante */
        .foto-debutante {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--rosa);
            box-shadow: 0 0 20px rgba(244, 172, 183, 0.4);
            margin: 0 auto 10px auto;
            display: block;
        }

        .content h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--rosa);
            margin-top: 5px;
        }

        .divider {
            width: 50px;
            height: 2px;
            background-color: var(--prata);
            margin: 10px auto;
        }

        .details p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .highlight {
            color: var(--prata-brilho);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .rsvp-text {
            font-size: 0.85rem;
            color: var(--rosa);
            margin-bottom: 5px;
        }

    </style>
</head>
<body>

    <!-- Tag de Áudio Oculta -->
    <!-- Substitua "sua-musica.mp3" pelo link ou caminho do seu arquivo de áudio -->
    <audio id="musicaFundo" loop>
        <source src="sua-musica.mp3" type="audio/mpeg">
    </audio>

    <div class="mobile-container">
        
        <!-- Tela Inicial (Capa) -->
        <div class="cover" id="coverScreen">
            <h1 class="title-cursive">Ana Julia</h1>
            <p class="subtitle">15 Anos</p>
            <p style="margin-bottom: 30px; font-size: 0.9rem;">Você tem um convite muito especial...</p>
            <button class="btn-open" onclick="abrirConvite()">TOCAR PARA ABRIR</button>
        </div>

        <!-- Tela Principal (Convite Aberto) -->
        <div class="content">
            <div>
                <!-- Foto da Debutante -->
                <!-- Substitua "sua-foto.jpg" pelo caminho da foto da Ana Julia -->
                <img src="sua-foto.jpg" alt="Ana Julia" class="foto-debutante">
                
                <h1>Ana Julia</h1>
                <div class="divider"></div>
                <p style="font-size: 0.9rem; margin-top: 10px;">Sob as bênçãos de Deus,<br>convido você para celebrar este<br>capítulo mágico da minha vida!</p>
            </div>

            <div class="details">
                <p><span class="highlight">DATA</span><br>16 de Outubro</p>
                <p><span class="highlight">HORÁRIO</span><br>Às 20:00</p>
                <p><span class="highlight">LOCAL</span><br>Raliflores, Cascalho</p>
            </div>

            <div class="buttons-container">
                <p class="rsvp-text">Confirme sua presença até 20/09</p>
                
                <a href="https://wa.me/5519999191494?text=Olá!%20Gostaria%20de%20confirmar%20minha%20presença%20nos%2015%20anos%20da%20Ana%20Julia!" target="_blank" class="btn">
                    Confirmar Presença
                </a>
                
                <a href="https://maps.google.com/?q=Raliflores,+Cascalho,+Cordeirópolis" target="_blank" class="btn" style="border-color: var(--prata); color: var(--prata);">
                    Localização (Maps)
                </a>
            </div>
        </div>

    </div>

    <script>
        // Função para acionar a animação e dar play na música
        function abrirConvite() {
            const cover = document.getElementById('coverScreen');
            const musica = document.getElementById('musicaFundo');
            
            // Inicia a animação de subir a capa
            cover.classList.add('open');
            
            // Dá play na música (o .catch previne erros no console caso algum navegador bloqueie)
            musica.play().catch(function(error) {
                console.log("Autoplay de áudio bloqueado pelas políticas do navegador.", error);
            });
        }
    </script>

</body>
</html>
