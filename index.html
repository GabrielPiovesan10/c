<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite 15 Anos - Ana Julia</title>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Variáveis de Cores */
        :root {
            --azul-escuro: #0a1128;
            --prata: #e0e0e0;
            --prata-brilho: #ffffff;
            --rosa: #f4acb7;
            --rosa-escuro: #d58996;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--prata);
            overflow-x: hidden;
        }

        /* Container Mobile */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(135deg, var(--azul-escuro) 0%, #1a2754 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* =========================================
           TELA 1: CAPA (Efeito de Abertura Real)
           ========================================= */
        .cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
        }

        /* As duas metades do convite (Portas/Abas) */
        .cover::before, .cover::after {
            content: '';
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, var(--azul-escuro) 0%, #121c3b 100%);
            z-index: 1; /* Atrás dos textos da capa */
            transition: transform 1.2s cubic-bezier(0.64, 0.05, 0.08, 1) 0.4s; /* O 0.4s faz as portas esperarem o texto sumir para abrir */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        /* Lado Esquerdo */
        .cover::before {
            left: 0;
            border-right: 2px solid var(--rosa);
        }

        /* Lado Direito */
        .cover::after {
            right: 0;
            border-left: 2px solid var(--rosa);
        }

        /* O Conteúdo da Capa (Textos e Botão) */
        .cover-content {
            position: relative;
            z-index: 2; /* Na frente das portas */
            text-align: center;
            padding: 20px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* --- ANIMAÇÃO QUANDO CLICA EM ABRIR --- */
        
        /* 1. O texto e botão somem suavemente */
        .cover.open .cover-content {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        /* 2. A porta esquerda desliza para fora */
        .cover.open::before {
            transform: translateX(-100%);
        }

        /* 3. A porta direita desliza para fora */
        .cover.open::after {
            transform: translateX(100%);
        }

        /* Desativa cliques na capa após abrir */
        .cover.open {
            pointer-events: none;
            transition: visibility 0s linear 2s;
            visibility: hidden; /* Esconde a div inteira após a animação terminar */
        }
        /* ========================================= */

        .title-cursive {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: var(--rosa);
            margin-bottom: 5px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--prata);
            margin-bottom: 50px;
            font-weight: 300;
        }

        /* Botão Interativo Principal */
        .btn-open {
            background: linear-gradient(135deg, var(--prata) 0%, #b8b8b8 100%);
            color: var(--azul-escuro);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2), inset 0 -3px 5px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 5px 25px rgba(244, 172, 183, 0.5); }
            100% { transform: scale(1); box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); }
        }

        /* Tela 2: Conteúdo Interno */
        .content {
            padding: 30px 20px;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            overflow-y: auto;
            opacity: 0;
            animation: fadeInContent 1s forwards;
            animation-delay: 1s; /* Espera a capa abrir para aparecer */
        }

        @keyframes fadeInContent {
            to { opacity: 1; }
        }

        .foto-debutante {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--rosa);
            box-shadow: 0 0 20px rgba(244, 172, 183, 0.4);
            margin: 0 auto 10px auto;
            display: block;
        }

        .content h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--rosa);
            margin-top: 5px;
        }

        .divider {
            width: 50px;
            height: 2px;
            background-color: var(--prata);
            margin: 10px auto;
        }

        .details p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .highlight {
            color: var(--prata-brilho);
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--rosa);
            color: var(--rosa);
            padding: 12px 30px;
            font-size: 0.9rem;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            width: 85%;
        }

        .btn:hover {
            background: var(--rosa);
            color: var(--azul-escuro);
            box-shadow: 0 0 15px rgba(244, 172, 183, 0.5);
        }

        .rsvp-text {
            font-size: 0.85rem;
            color: var(--rosa);
            margin-bottom: 5px;
        }

    </style>
</head>
<body>

    <!-- Música -->
    <audio id="musicaFundo" loop>
        <source src="sua-musica.mp3" type="audio/mpeg">
    </audio>

    <div class="mobile-container">
        
        <!-- Tela Inicial (Capa com Efeito de Abertura) -->
        <div class="cover" id="coverScreen">
            <div class="cover-content">
                <h1 class="title-cursive">Ana Julia</h1>
                <p class="subtitle">15 Anos</p>
                <p style="margin-bottom: 40px; font-size: 0.9rem; color: #a8a8a8;">Você tem um convite muito especial...</p>
                <!-- Botão simula o fecho/selo do convite -->
                <button class="btn-open" onclick="abrirConvite()">TOCAR PARA ABRIR</button>
            </div>
        </div>

        <!-- Tela Principal (Convite Interno) -->
        <div class="content">
            <div>
                <!-- Foto -->
                <img src="sua-foto.JPG" alt="Ana Julia" class="foto-debutante">
                
                <h1>Ana Julia</h1>
                <div class="divider"></div>
                <p style="font-size: 0.9rem; margin-top: 10px;">Sob as bênçãos de Deus,<br>convido você para celebrar este<br>capítulo mágico da minha vida!</p>
            </div>

            <div class="details">
                <p><span class="highlight">DATA</span><br>16 de Outubro</p>
                <p><span class="highlight">HORÁRIO</span><br>Às 20:00</p>
                <p><span class="highlight">LOCAL</span><br>Raliflores, Cascalho</p>
            </div>

            <div class="buttons-container">
                <p class="rsvp-text">Confirme sua presença até 20/09</p>
                
                <a href="https://wa.me/5519999191494?text=Olá!%20Gostaria%20de%20confirmar%20minha%20presença%20nos%2015%20anos%20da%20Ana%20Julia!" target="_blank" class="btn">
                    Confirmar Presença
                </a>
                
                <a href="https://maps.google.com/?q=Raliflores,+Cascalho,+Cordeirópolis" target="_blank" class="btn" style="border-color: var(--prata); color: var(--prata);">
                    Localização (Maps)
                </a>
            </div>
        </div>

    </div>

    <script>
        function abrirConvite() {
            const cover = document.getElementById('coverScreen');
            const musica = document.getElementById('musicaFundo');
            
            // Aciona as classes de animação da capa
            cover.classList.add('open');
            
            // Inicia a música
            musica.play().catch(function(error) {
                console.log("Autoplay de áudio bloqueado.", error);
            });
        }
    </script>

</body>
</html>
