<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite 15 Anos - Ana Júlia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Cinzel', 'Georgia', serif;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }
        .container {
            width: 340px;
            height: 500px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2b2b2b;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            transition: opacity 0.5s ease;
        }
        .envelope-flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-top: 130px solid #3d3d3d;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 4;
        }
        .envelope-text {
            color: #d4af37;
            font-size: 18px;
            letter-spacing: 2px;
            text-align: center;
            z-index: 5;
            padding: 20px;
            text-transform: uppercase;
        }
        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1;
            border: 2px solid #d4af37;
        }
        .open .envelope-flap {
            transform: rotateX(180deg);
        }
        .open .envelope {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            color: #1e90ff;
            font-size: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h2 {
            color: #ff69b4;
            font-size: 26px;
            margin: 5px 0 15px 0;
            font-family: 'Brush Script MT', cursive;
        }
        .details {
            font-size: 14px;
            color: #444;
            line-height: 1.8;
            text-align: left;
            border-top: 1px dashed #d4af37;
            border-bottom: 1px dashed #d4af37;
            padding: 15px 0;
        }
        .details strong {
            color: #1e90ff;
        }
        .footer-text {
            font-size: 13px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container" id="inviteCard" onclick="openEnvelope()">
        <!-- Envelope Animado -->
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-text">Toque para abrir o Convite</div>
        </div>

        <!-- Conteúdo do Convite Profissional -->
        <div class="card">
            <div>
                <h1>Festa de 15 Anos</h1>
                <h2>Ana Júlia</h2>
            </div>
            
            <div class="details">
                <p><strong>Data:</strong> 16/10</p>
                <p><strong>Horário:</strong> 20:00</p>
                <p><strong>Local:</strong> Rally Flores, Cascalho</p>
                <p><strong>Cores:</strong> Azul, Rosa e Prata</p>
                <p><strong>Confirmação até:</strong> 20/09</p>
                <p><strong>Contato:</strong> (19) 99999-1494</p>
            </div>

            <div class="footer-text">
                <p>Sua presença é essencial para tornar este momento inesquecível!</p>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            const card = document.getElementById('inviteCard');
            card.classList.add('open');
        }
    </script>

</body>
</html>
